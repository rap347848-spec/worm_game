name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.wormgame --project-name worm_game .
          rm -rf test

      - name: Configure manifest (name + Bluetooth/WiFi permissions)
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION', 'BLUETOOTH', 'BLUETOOTH_ADMIN', 'BLUETOOTH_SCAN', 'BLUETOOTH_ADVERTISE', 'BLUETOOTH_CONNECT', 'ACCESS_WIFI_STATE', 'CHANGE_WIFI_STATE', 'NEARBY_WIFI_DEVICES', 'VIBRATE', 'INTERNET', 'ACCESS_NETWORK_STATE', 'CHANGE_WIFI_MULTICAST_STATE']
          add = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x for x in perms)
          s = s.replace('<application', add + '    <application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="لعبة الدودة"', s)
          s = re.sub(r'(<application[^>]*>)', r'\1\n        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Set minSdk 23 (needed by Nearby Connections)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/; s/minSdk flutter.minSdkVersion/minSdk 23/' "$f"
            fi
          done

      - name: Use fixed signing key (keeps player name and level when updating the app)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: worm-game-apk
          path: build/app/outputs/flutter-apk/app-release.apk
